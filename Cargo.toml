[workspace]
members = [
	"crates/*",
	"2015/04",
	"2015/07",
	"2015/08",
	"2017/*",
	"2019/10",
	"2019/intcode_computer",
	"2020/*",
	"2021/*",
	"2022/*",
	"2023/*",
	"2024/*",
]
resolver = "2"

[workspace.package]
edition = "2024"

[profile.release]
overflow-checks = true
debug = true
opt-level = 3 # sometimes 's' might help
# panic = "abort"

[profile.dev.package."*"]
opt-level = 2

[workspace.dependencies]
itertools = "0.14.0"
grid = "1.0.0"
ndarray = "0.17.1"
nalgebra = "0.34.1"
owo-colors = "4.1.0"
petgraph = "0.8.3"

aoc-grid = { path = "crates/aoc-grid" }

[workspace.lints.clippy]
decimal_literal_representation = "warn"
