destinations:
- id: 0
  name: top
  description: Top-level packets, e.g. ping/pong
  types:
  - id: 0
    name: ping
    payload:
    - name: data
      width_bytes: 4
  - id: 1
    name: pong
    reply-to: ping
    payload:
    - name: data
      width_bytes: 4
  - id: 2
    name: write_ram
    payload:
    - name: offset
      width_bytes: 4
    - name: data
      width_bytes: 128
  - id: 3
    name: write_ram_ack
    reply-to: write_ram
    payload:
    - name: offset
      width_bytes: 4
    - name: ok
      width_bytes: 4
  - id: 4
    name: read_ram
    payload:
    - name: offset
      width_bytes: 4
  - id: 5
    name: read_ram_ack
    reply-to: read_ram
    payload:
    - name: offset
      width_bytes: 4
    # bodge some padding into the okay field
    - name: ok
      width_bytes: 4
    - name: data
      width_bytes: 128
  - id: 6
    name: run_day
    payload:
    - name: day
      width_bytes: 1
    - name: data_len_bytes
      width_bytes: 2
    - name: padding
      width_bytes: 1
  - id: 7
    name: run_day_ack
    payload:
    - name: day
      width_bytes: 1
    - name: ok
      width_bytes: 1
    - name: padding
      width_bytes: 2
    - name: part1
      width_bytes: 4
    - name: part2
      width_bytes: 4
