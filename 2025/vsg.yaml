# Configuration for vsg - https://vhdl-style-guide.readthedocs.io/
# Loosely based on jcl style, with modifications
file_list:
  - hdl/**/*.vhd
rule:
  # Max line length
  length_001:
     length: 80
  # Forbids direct instantiation
  instantiation_034:
    disable: true
  # Checks for default assignment
  signal_007:
    disable: true
  # Checks for default assignment
  variable_007:
    disable: true
  # Set Uppercase rules
  architecture_011 :
    case : upper
  architecture_013 :
    case : upper
  architecture_014 :
    case : upper
  component_008 :
    case : upper
  component_012 :
    case : upper
  entity_008 :
    case : upper
  entity_012 :
    case : upper
  generate_005 :
    case : upper
  generate_012 :
    case : upper
  generic_007 :
    case : upper
  instantiation_008 :
    case : upper
  instantiation_009 :
    case : upper
  port_map_002:
    case : upper
  generic_map_002:
    case : upper
  port_010 :
    case : upper
  process_017 :
    case : upper
  process_019 :
    case : upper
  type_500 :
    case : upper
  # Ignored rules
  library_500 :
    disable : true
  # Set alignment rules
  architecture_026 :
    compact_alignment : true
    blank_line_ends_group : true
    comment_line_ends_group : false
  architecture_027 :
    compact_alignment : true
    blank_line_ends_group : true
    comment_line_ends_group : false
  component_017 :
    compact_alignment : true
    blank_line_ends_group : true
    comment_line_ends_group : false
  concurrent_008 :
    compact_alignment : true
    blank_line_ends_group : true
    comment_line_ends_group : true
  entity_017 :
    compact_alignment : true
    blank_line_ends_group : true
    comment_line_ends_group : false
  entity_018 :
    compact_alignment : true
    blank_line_ends_group : true
    comment_line_ends_group : false
  entity_020 :
    compact_alignment : true
    blank_line_ends_group : true
    comment_line_ends_group : false
    seperate_generic_port_alignment : true
  process_034 :
    compact_alignment : true
    blank_line_ends_group : true
    comment_line_ends_group : false
  process_035 :
    compact_alignment : true
    blank_line_ends_group : true
    comment_line_ends_group : false
    include_lines_without_comments : false
  process_400:
    compact_alignment : true
    blank_line_ends_group : true
    comment_line_ends_group : true
  variable_assignment_004:
    align_paren: false
  # Set optional item rules
  instantiation_033 :
    action : remove

  # Set blank line rules (the rule group is no good because it includes
  # basically everything)
  case_200 :
    disable: True
  block_203: { style: no_blank_line }           # blank below 'begin'
  block_204: { style: no_blank_line }           # blank below 'end'
  subprogram_body_201: { style: no_blank_line } # blank below 'is'
  subprogram_body_203: { style: no_blank_line } # blank below 'begin'
  subprogram_body_204: { style: no_blank_line } # blank above 'end'
  loop_statement_200: { disable: true } # blank above 'loop'
  loop_statement_201: { style: no_blank_line } # blank below 'loop'
  loop_statement_202: { style: no_blank_line } # blank above 'end'
  loop_statement_203: { style: no_blank_line } # blank below 'end'
  case_007: { disable: true } # blank above 'case'
  case_010: { disable: true } # blank below 'end case'
  case_009: { style: no_blank_line } # blank above 'end case'
  case_200: { style: no_blank_line } # blank below '=>'
  entity_016: { style: no_blank_line } # blank above 'end entity'
  entity_200: { style: no_blank_line } # blank above 'generic'
  entity_201: { style: no_blank_line } # blank below 'is'
  architecture_015: { style: no_blank_line } # blank below declaration
  architecture_016: { disable: true } # blank above 'begin'
  # architecture_017: { style: no_blank_line } # blank below 'begin'
  process_021: { style: no_blank_line } # blank above 'begin' if no decl
  process_022: { style: no_blank_line } # blank below 'begin'
  process_023: { style: no_blank_line } # blank above 'end process'
  process_026: { style: no_blank_line } # blank above first decl line
  process_027: { style: no_blank_line } # blank above 'begin' if decl
  if_031: { disable: true } # blank above 'if'
  if_030: { disable: true } # blank below 'end if'

  # Set structure rules
  function_019:
    first_open_paren: 'remove_new_line'
    last_close_paren: 'add_new_line'
    interface_list_semicolon: 'remove_new_line'
    interface_element: 'add_new_line'
    ignore_single_line: 'yes'
  procedure_013:
    first_open_paren: 'remove_new_line'
    last_close_paren: 'add_new_line'
    interface_list_semicolon: 'remove_new_line'
    interface_element: 'add_new_line'
    ignore_single_line: 'yes'
